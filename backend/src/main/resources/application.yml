spring:
  application:
    name: fatoora
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fatoora}
    username: ${DB_USERNAME:fatoora}
    password: ${DB_PASSWORD:fatoora}
  jpa:
    # Never let Hibernate change the schema; Flyway owns it. "validate" fails fast
    # on startup if entities and tables disagree.
    hibernate:
      ddl-auto: validate
    # Keep DB sessions short: one per transaction, not one per HTTP request.
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true
  # Local SMTP = Mailpit (docker compose). Read sent mail at http://localhost:8025.
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  thymeleaf:
    check-template-location: false

app:
  payments:
    # mock = built-in test checkout (no real money); stripe = Stripe Checkout.
    provider: ${PAYMENTS_PROVIDER:mock}
    mock:
      webhook-secret: ${MOCK_WEBHOOK_SECRET:local-mock-webhook-secret}
    stripe:
      secret-key: ${STRIPE_SECRET_KEY:}
      webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
      api-base: https://api.stripe.com
  mail:
    from: ${MAIL_FROM:invoices@fatoora.local}
    public-url: ${PUBLIC_URL:http://localhost:3000}
  storage:
    type: ${STORAGE_TYPE:s3}
    s3:
      endpoint: ${S3_ENDPOINT:http://localhost:9000}
      region: ${S3_REGION:us-east-1}
      bucket: ${S3_BUCKET:fatoora}
      access-key: ${S3_ACCESS_KEY:fatoora}
      secret-key: ${S3_SECRET_KEY:fatoora-secret}
      path-style: true
  jwt:
    issuer: fatoora
    # Local default only. Set JWT_SECRET (32+ chars) in every real environment.
    secret: ${JWT_SECRET:local-dev-only-secret-change-me-0123456789}
    ttl: PT1H

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  swagger-ui:
    path: /swagger-ui.html
