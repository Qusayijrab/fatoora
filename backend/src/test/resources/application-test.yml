spring:
  flyway:
    # Real migrations + a test-only table used to prove @TenantId filtering works.
    locations: classpath:db/migration,classpath:db/testmigration

app:
  fx:
    ecb-enabled: false
  # Tests drive JobsService directly with a chosen "now"; no background timers.
  jobs:
    enabled: false
  storage:
    type: memory
  payments:
    mock:
      enabled: true
  # Every test signs up from the same address; the per-email login limit and the email
  # limit stay low so tests can prove they work.
  rate-limits:
    logins-per-ip-per10-minutes: 100000
    registrations-per-ip-per-hour: 100000
    emails-per-organization-per-hour: 5
  jwt:
    secret: test-secret-test-secret-test-secret-0123
