spring:
  flyway:
    # Real migrations + a test-only table used to prove @TenantId filtering works.
    locations: classpath:db/migration,classpath:db/testmigration

app:
  # Tests drive JobsService directly with a chosen "now"; no background timers.
  jobs:
    enabled: false
  storage:
    type: memory
  jwt:
    secret: test-secret-test-secret-test-secret-0123
